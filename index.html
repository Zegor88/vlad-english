<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>English</title><style>body{margin:0;background:#eef4ef;color:#183126;font:18px/1.5 system-ui}main{max-width:680px;margin:auto;padding:28px 18px}h1{font:800 clamp(2.2rem,8vw,3.5rem)/1 Georgia,serif}.panel{background:white;border:1px solid #c7d6cc;border-radius:20px;padding:20px;margin:16px 0}.path{display:flex;gap:7px;flex-wrap:wrap}.dot{width:28px;height:28px;border-radius:50%;border:2px solid #579174;text-align:center;font-weight:800}.dot.on{background:#17644e;color:white;border-color:#17644e}.tag{color:#5a6b61;font-weight:700;font-size:.85rem}button,a{display:block;width:100%;box-sizing:border-box;min-height:54px;margin-top:12px;border:0;border-radius:13px;background:#17644e;color:white;text-align:center;padding:14px;font:800 1rem system-ui;text-decoration:none}.quiet{background:white;color:#17644e;border:1px solid #c7d6cc}.option{display:flex;gap:10px;border:1px solid #c7d6cc;border-radius:12px;padding:13px;margin:9px 0;font-weight:650}.option input{width:21px;height:21px}.feedback{padding:12px;background:#fff6e2;border-radius:12px}.hidden{display:none}</style><main><h1>Карта времён</h1><p>Сначала выбери смысл: <b>обычно</b>, <b>сейчас</b>, <b>вчера</b> или <b>в момент вчера</b>. Потом форма станет понятнее.</p><section class="panel"><div class="tag">ТВОЙ ПУТЬ</div><div class="path" id="path"></div><p id="resume">Сегодня: короткий шаг</p><button id="start">Начать</button><button class="quiet" id="all">Все шаги</button></section><section class="panel" id="lesson"><div class="tag" id="count"></div><h2 id="title"></h2><p id="rule"></p><p id="example"></p><button id="practice">Попробовать один вопрос</button><p id="extra" class="hidden"></p><a id="resource" class="hidden" target="_blank" rel="noopener noreferrer">Хочешь ещё? Дополнительная игра</a><button class="quiet" id="stop">На сегодня достаточно</button></section><section class="panel hidden" id="quiz"><div class="tag">ОДИН ВОПРОС</div><p id="question"></p><div id="options"></div><p id="feedback" class="feedback hidden"></p><button id="next">Следующий вопрос</button><button class="quiet" id="finish">Сегодня хватит</button></section><section class="panel hidden" id="done"><h2>Сегодня хватит</h2><p id="doneText">Ты остановился на шаге 1. В следующий раз начнём отсюда.</p><button id="map">Вернуться к карте</button></section><section class="panel hidden" id="steps"></section></main><script>(()=>{const K='vlad-english-tense-path-v1';let s=JSON.parse(localStorage.getItem(K)||'{"step":0,"done":[]}');const L=[['Факт или процесс?','Simple — факт, привычка или завершённое событие. Continuous — действие в процессе.','Every Saturday I play. / I am playing now.','Every Saturday I play hockey. Это…',['привычка','действие сейчас','вчера'],0,null],['Present Simple: обычно','do/does → обычный глагол. С he/she/it: plays.','He plays on Fridays.','He doesn’t ___ tennis.',['play','plays','playing'],0,'https://learnenglishkids.britishcouncil.org/grammar-vocabulary/grammar-practice/present-simple-present-continuous'],['Present Continuous: сейчас','am/is/are + глагол-ing.','She is reading now.','Look! The team ___.',['is training','trains','trained'],0,'https://www.cambridgeenglish.org/learning-english/activities-for-learners/a1g002-present-simple-and-present-continuous-questions'],['Past Simple: факт вчера','did/didn’t → обычный глагол.','Did you play? I didn’t play.','Yesterday we ___ home.',['went','goed','go'],0,'https://learnenglishkids.britishcouncil.org/grammar-vocabulary/grammar-practice/past-simple-sentences'],['Past Continuous: момент вчера','was/were + глагол-ing.','At 5 I was playing.','At 7 yesterday I ___ dinner.',['was having','had','am having'],0,null],['Past Simple или Continuous?','Факт: played. Процесс в момент: was playing.','Yesterday I played. At 6 I was playing.','At 6 yesterday I ___ a game.',['was playing','played','am playing'],0,null],['Смешанная практика','Обычно? Сейчас? Вчера? В момент вчера?','Сначала смысл, потом форма.','Every morning he ___ breakfast.',['has','is having','was having'],0,null]];const $=id=>document.getElementById(id);function save(){localStorage.setItem(K,JSON.stringify(s))}function render(){let x=L[s.step];$('path').innerHTML=L.map((_,i)=>'<span class="dot '+(i===s.step?'on':s.done.includes(i)?'on':'')+'">'+(i+1)+'</span>').join('');$('resume').textContent=(s.done.length?'Продолжить: ':'Сегодня: ')+'Шаг '+(s.step+1)+' из 7';$('count').textContent='ШАГ '+(s.step+1)+' ИЗ 7';$('title').textContent=x[0];$('rule').textContent=x[1];$('example').textContent=x[2];$('resource').classList.toggle('hidden',!x[5]);if(x[5])$('resource').href=x[5];$('lesson').classList.remove('hidden');$('quiz').classList.add('hidden');$('done').classList.add('hidden')}$('start').onclick=render;$('practice').onclick=()=>{let x=L[s.step];$('question').textContent=x[3];$('options').innerHTML=x[4].map((o,i)=>'<label class="option"><input type="radio" name="a" value="'+i+'">'+o+'</label>').join('');$('feedback').classList.add('hidden');$('lesson').classList.add('hidden');$('quiz').classList.remove('hidden')};$('next').onclick=()=>{let x=L[s.step],v=document.querySelector('input[name=a]:checked');if(!v){$('feedback').textContent='Сначала выбери вариант — можно попробовать спокойно.';$('feedback').classList.remove('hidden');return}$('feedback').textContent=+v.value===x[5]?'Верно. '+x[1]:'Почти. '+x[1];$('feedback').classList.remove('hidden');s.done=[...new Set([...s.done,s.step])];if(s.step<6)s.step++;save();$('next').textContent='Продолжить к следующему шагу';$('next').onclick=render};function stop(){save();$('lesson').classList.add('hidden');$('quiz').classList.add('hidden');$('doneText').textContent='Ты остановился на шаге '+(s.step+1)+'. В следующий раз начнём отсюда.';$('done').classList.remove('hidden')}$('stop').onclick=stop;$('finish').onclick=stop;$('map').onclick=render;$('all').onclick=()=>{$('steps').classList.toggle('hidden');$('steps').innerHTML='<h2>Все шаги</h2>'+L.map((x,i)=>'<button class="quiet" data-i="'+i+'">'+(i+1)+'. '+x[0]+'</button>').join('');$('steps').querySelectorAll('button').forEach(b=>b.onclick=()=>{s.step=+b.dataset.i;save();render()})};render()})();</script></html>
