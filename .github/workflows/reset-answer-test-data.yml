name: Reset answer-service test data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.131.1'
          workingDirectory: answers-worker
          command: d1 execute vlad_english_answers --remote --command "DELETE FROM answers;"
